<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4523">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>My Bookshelf</title>
<style>
:root{--wall:#e9dcc4;--wall2:#e3d4b9;--fl1:#b98a5a;--fl2:#a67a4c;--base:#f3ecdf;--sky1:#8fc7ee;--sky2:#e8f5ff;--orb:#fff3b0;--cloud:rgba(255,255,255,.8);--bg:#f1e8da;--ink:#2a2118;--muted:#7a6a58;--wood:#9a6538;--wood2:#6d4523;--card:#fffaf1;--line:#d9ccb8;--acc:#8b2e2e}
@media (prefers-color-scheme:dark){:root{--wall:#2b231c;--wall2:#271f19;--fl1:#4a3421;--fl2:#3f2c1b;--base:#5a4a3a;--sky1:#111a33;--sky2:#2d3c6b;--orb:#f4f1de;--cloud:rgba(255,255,255,.12);--bg:#1a1511;--ink:#f0e6d6;--muted:#a8977f;--wood:#7a4f2b;--wood2:#4e3019;--card:#261f18;--line:#3d3226;--acc:#d9746b}}
*{box-sizing:border-box}
body{margin:0;background:var(--wallbg,repeating-linear-gradient(90deg,var(--wall) 0 46px,var(--wall2) 46px 92px));color:var(--ink);font:16px/1.4 Georgia,serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 8px;max-width:860px;width:100%;margin:0 auto;flex-wrap:wrap;color:var(--hd,var(--ink))}
h1{margin:0;font-size:26px}.sub{color:var(--hdm,var(--muted));font-size:14px}
button{font:inherit;cursor:pointer}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:system-ui,sans-serif}
.tools button{border-radius:999px;padding:9px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.tools .add{background:var(--acc);color:#fff;border:0;font-weight:600;font-size:16px;padding:10px 18px}
#shelf{width:100%;display:block}
.scene{display:flex;align-items:flex-start;justify-content:center;gap:44px;width:100%;max-width:860px;margin:0 auto;padding:0 14px}
.window{position:relative;flex:none;width:150px;height:210px;margin-top:40px;border:9px solid var(--base);display:var(--wind,block);border-radius:var(--wr,75px 75px 3px 3px);background:linear-gradient(var(--sky1),var(--sky2));box-shadow:0 6px 16px rgba(0,0,0,.25)}
.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--base)}
.window:after{content:"";position:absolute;left:0;right:0;top:55%;height:6px;background:var(--base)}
.window .orb{position:absolute;right:22px;top:36px;width:26px;height:26px;border-radius:50%;background:var(--orb);box-shadow:0 0 18px var(--orb)}
.window .cloud{position:absolute;left:14px;top:92px;width:46px;height:14px;border-radius:14px;background:var(--cloud)}
.window .sill{position:absolute;left:-20px;right:-20px;bottom:-22px;height:13px;background:var(--base);border-radius:3px;box-shadow:0 4px 6px rgba(0,0,0,.25);z-index:1}
.case{position:relative;flex:1 1 auto;min-width:0;max-width:540px;margin-top:105px;padding:10px 7px 0;background:linear-gradient(90deg,var(--wood2),var(--wood) 50%,var(--wood2));border-radius:8px 8px 0 0;box-shadow:8px 0 18px rgba(0,0,0,.25)}
.plant{position:absolute;right:28px;bottom:100%;margin-bottom:-2px;width:74px}
.lamp{position:absolute;left:26px;bottom:100%;margin-bottom:-2px;width:52px;filter:drop-shadow(0 0 14px rgba(255,215,106,.55))}
.floor{flex:1;min-height:70px;padding-bottom:env(safe-area-inset-bottom,0px);border-top:12px solid var(--base);position:relative;background:var(--floorbg,repeating-linear-gradient(90deg,var(--fl1) 0 118px,var(--fl2) 118px 120px));box-shadow:inset 0 10px 14px rgba(0,0,0,.25)}
.frame{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 24px);width:62px;height:76px;border:5px solid var(--wood2);background:linear-gradient(#f0d9a0 58%,#5e8a55 58%);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 0 0 4px #f6efe0}
.frame i{position:absolute;left:14px;top:14px;width:14px;height:14px;border-radius:50%;background:#e8833a}
.stack{position:absolute;right:112px;bottom:100%;margin-bottom:-2px;width:50px}
.catw{position:absolute;width:52px;z-index:2;display:var(--catd,block)}.cat{display:block;width:100%;overflow:visible}
.rug{width:min(70%,520px);height:30px;margin:16px auto 0;border-radius:50%;position:relative;display:var(--rugd,block);background:var(--rugbg,repeating-linear-gradient(90deg,#a4552b 0 14px,#e2c9a0 14px 22px,#2f4b6e 22px 36px,#e2c9a0 36px 44px));box-shadow:0 3px 6px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.25)}
.cat{cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat *{transform-box:fill-box}
.cat .tail{transform-origin:0 100%;animation:tail 2.6s ease-in-out infinite}
.cat .body{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.cat .eye{transform-origin:50% 50%;animation:blink 5s infinite}
.cat .ear2{transform-origin:50% 100%;animation:twitch 7s infinite}
.cat.hop{animation:hop .5s ease-out}
.heart{position:absolute;left:50%;bottom:100%;margin-left:-8px;color:#e0566b;font-size:18px;z-index:3;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes breathe{50%{transform:scaleY(1.04)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(14deg)}96%{transform:rotate(-4deg)}}
@keyframes hop{40%{transform:translateY(-16px)}}
@keyframes up{to{transform:translateY(-34px);opacity:0}}
@media(prefers-reduced-motion:reduce){.cat,.cat *{animation:none!important}}
.lamp{display:var(--lampd,block)}.stack{display:var(--stackd,block)}.plant{display:var(--plantd,block)}.frame{display:var(--framed,block)}
.plant .pot{fill:var(--pot,#c1663a)}.plant .pot2{fill:var(--pot2,#d47a4a)}
.cat .c{fill:var(--cat,var(--a))}.cat .ct{stroke:var(--cat,var(--a))}.cat .st{stroke:var(--cat-st,var(--a2))}.cat .c2{fill:var(--a3)}.cat .d{fill:var(--cat-st,var(--a2))}.cat .eye{fill:var(--cat-eye,#222)}.cat .nose{stroke:var(--cat-nose,#222)}
.cat .bob{transform-origin:50% 100%;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
.catw[data-spot=sill]{left:16px;bottom:-9px}
.catw[data-spot=top]{left:108px;bottom:100%;margin-bottom:-2px}
.catw[data-spot=floor]{left:max(10px,calc(50% - 400px));top:-24px}
.catw[data-spot=rug]{left:44%;bottom:6px}
.cat.arrive{animation:arrive .6s ease-out}
@keyframes arrive{0%{transform:translateY(-44px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:none}}
.pnl{background:var(--card);border-radius:14px;max-width:480px;width:100%;max-height:100%;overflow:auto;padding:18px;font-family:system-ui,sans-serif}
.pnl h2{margin:0 0 6px;font:600 20px Georgia,serif}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid h3{grid-column:1/-1;margin:10px 0 0;font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media(max-width:420px){.pgrid{grid-template-columns:1fr}}
.pnl select{font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
.pnl .btns{margin-top:16px}
@media(max-width:720px){.frame{display:none}.catw[data-spot=sill]{width:34px;left:8px}}
@media(max-width:720px){.scene{flex-direction:column;align-items:center;gap:30px}.window{width:100px;height:140px;margin-top:6px;border-radius:var(--wrm,50px 50px 3px 3px)}.window .orb{width:18px;height:18px;right:14px;top:24px}.window .cloud{top:60px;width:30px;left:8px}.case{flex:none;width:100%;margin-top:100px}}
.unit{background:var(--wood2);padding:0 6px}
.row{display:flex;align-items:flex-end;gap:3px;padding:16px 10px 0;min-height:190px;background:rgba(0,0,0,.28);box-shadow:inset 0 10px 18px rgba(0,0,0,.35)}
.board{height:16px;background:linear-gradient(var(--wood),var(--wood2));box-shadow:0 5px 8px rgba(0,0,0,.35);margin:0 -6px}
.spine{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 0 8px;border:0;border-radius:2px 2px 0 0;background-size:100% 100%;background-image:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 25%,rgba(0,0,0,0) 60%,rgba(0,0,0,.3));transition:transform .18s;flex:none;overflow:hidden}
.spine.img{background-image:none}
.spine:hover,.spine:focus-visible{transform:translateY(-10px);outline:none}
.spine .t{writing-mode:vertical-rl;font-weight:700;overflow:hidden;flex:1;max-height:130px;text-align:left}
.spine .a{writing-mode:vertical-rl;font-size:10px;opacity:.75;margin-top:6px;max-height:48px;overflow:hidden;white-space:nowrap}
.spine .r{font:700 12px system-ui,sans-serif;margin-top:6px;background:rgba(255,255,255,.25);border-radius:8px;padding:1px 5px;color:inherit}
.empty{color:#f1e8da;align-self:center;margin:auto;padding:0 20px;text-align:center;opacity:.85}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:5}
.ov.on{display:flex}
.sheet{background:var(--card);border-radius:14px;max-width:800px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:230px 1fr;gap:6px 18px;padding:18px}
@media(max-width:640px){.sheet{grid-template-columns:1fr}}
.stage{perspective:900px;height:270px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.book{width:150px;height:220px;position:relative;transform-style:preserve-3d;transform:rotateY(-28deg);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.book.flip{transform:rotateY(152deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;border-radius:2px 6px 6px 2px;background-size:cover;background-position:center}
.front{transform:translateZ(14px);background-color:var(--c);color:#fff;padding:22px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;box-shadow:inset 0 0 0 5px rgba(255,255,255,.12)}
.front.img{box-shadow:none}.front.img *{display:none}
.front b{font-size:19px;line-height:1.15;word-break:break-word}.front i{font-size:12px;opacity:.85}
.back{transform:rotateY(180deg) translateZ(14px);background-color:#f6eedd;color:#2a2118;padding:14px;font-size:11.5px;overflow:auto;white-space:pre-wrap;box-shadow:inset 0 0 0 4px var(--c)}
.back.img{padding:0;box-shadow:none}
.sp{position:absolute;width:28px;height:100%;left:61px;transform:rotateY(-90deg) translateZ(75px);background-color:var(--c);background-size:100% 100%;filter:brightness(.8)}
.pg{position:absolute;width:28px;height:96%;top:2%;left:61px;transform:rotateY(90deg) translateZ(75px);background:repeating-linear-gradient(0deg,#f4ecdc,#f4ecdc 2px,#d8ccb2 3px)}
.hint{text-align:center;font:12px system-ui,sans-serif;color:var(--muted)}
form{display:flex;flex-direction:column;gap:10px;font-family:system-ui,sans-serif;grid-row:1/3;grid-column:2}
@media(max-width:640px){form{grid-row:auto;grid-column:1}}
label,.lb{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,textarea{font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=color]{padding:2px;height:36px;width:70px}
#res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
#res:empty{display:none}
#res button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px;border:0;border-bottom:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
#res img{width:28px;height:42px;object-fit:cover;background:var(--line);flex:none}
#res small{color:var(--muted)}
#st{font-size:12px;color:var(--muted);min-height:16px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px dashed var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.slot .th{height:54px;background:var(--bg) center/contain no-repeat;border-radius:4px;margin-bottom:4px}
.slot button{font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:1px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{border-radius:8px;padding:10px 16px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btns .pri{background:var(--acc);color:#fff;border:0;font-weight:600}
.btns .del{color:var(--acc);margin-left:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font:14px system-ui,sans-serif;display:none;z-index:9}
</style></head>
<body>
<header><div><h1>📚 My Bookshelf</h1><div class="sub" id="count"></div></div>
<div class="tools"><button id="set">⚙ Customize</button><button id="exp">Export</button><button id="imp">Import</button><input type="file" id="impf" accept=".json" hidden><button class="add" id="addBtn">+ Add a book</button></div></header>
<div class="scene">
 <div class="window"><i class="orb"></i><i class="cloud"></i><i class="sill"></i><div class="catw" id="catw" data-spot="sill"><svg class="cat" viewBox="0 0 60 56" role="img" aria-label="Cat (click me)"><path class="tail ct" d="M44 50c14-2 14-20 4-24" fill="none" stroke-width="6" stroke-linecap="round"/><g class="body"><ellipse class="c" cx="28" cy="40" rx="18" ry="15"/><path class="st" d="M22 28v8M29 28v8M36 30v7" fill="none" stroke-width="2.5" stroke-linecap="round"/></g><circle class="c" cx="24" cy="20" r="12"/><path class="c" d="M13 14l2-12 9 7z"/><path class="c ear2" d="M35 14l-2-12-9 7z"/><circle class="eye" cx="20" cy="19" r="1.8"/><circle class="eye" cx="28" cy="19" r="1.8"/><path class="nose" d="M22 24l2 2 2-2" fill="none" stroke-width="1.2"/></svg></div></div>
 <div class="case">
  <div class="frame"><i></i></div>
  <svg class="stack" viewBox="0 0 50 36" aria-hidden="true"><rect x="2" y="24" width="44" height="10" rx="1" fill="#2f4b6e"/><rect x="6" y="14" width="38" height="10" rx="1" fill="#a4552b"/><rect x="4" y="5" width="40" height="9" rx="1" fill="#3f6b4f"/></svg>
  <svg class="lamp" viewBox="0 0 70 90" aria-hidden="true"><path d="M22 6h26l10 30H12z" fill="#e9b949"/><rect x="33" y="36" width="4" height="40" fill="#6d4523"/><ellipse cx="35" cy="80" rx="16" ry="6" fill="#6d4523"/></svg>
  <svg class="plant" id="plant" viewBox="0 0 80 110" aria-hidden="true"><g fill="#3b6f43"><ellipse cx="40" cy="42" rx="8" ry="26" transform="rotate(-62 40 70)"/><ellipse cx="40" cy="42" rx="8" ry="26" transform="rotate(62 40 70)"/></g><g fill="#4f8a55"><ellipse cx="40" cy="38" rx="9" ry="30"/><ellipse cx="40" cy="42" rx="9" ry="28" transform="rotate(-32 40 70)"/><ellipse cx="40" cy="42" rx="9" ry="28" transform="rotate(32 40 70)"/></g><path d="M22 72h36l-5 34H27z" fill="#c1663a"/><rect x="19" y="66" width="42" height="9" rx="2" fill="#d47a4a"/></svg>
  <main id="shelf"></main>
 </div>
</div>
<div class="floor"><div class="rug"></div></div>

 <div><div class="stage" id="stage"><div class="book" id="book">

<script>
const $=id=>document.getElementById(id),LS='bookshelf-hosted-v1';
let books=[],cur=null,draft={},timer;
try{books=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){}
function store(){keepSafe();try{localStorage.setItem(LS,JSON.stringify(books))}catch(e){toast('Storage full: export a backup and remove some images')}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
const sw=b=>Math.round(b.w*.85),sh=b=>Math.round(b.h*.8);
const lum=h=>{const n=parseInt(h.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)};
async function shrink(blob,max=520){const bm=await createImageBitmap(blob),s=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}
async function fromUrl(u){const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob();if(b.size<1500)throw 0;return shrink(b)}
function avgColor(data){return new Promise(res=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=4;const x=c.getContext('2d');x.drawImage(i,0,0,4,4);const d=x.getImageData(0,0,4,4).data;let r=0,g=0,b=0;for(let k=0;k<64;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}
 res('#'+[r,g,b].map(v=>Math.round(v/16*.75).toString(16).padStart(2,'0')).join(''))};i.onerror=()=>res(null);i.src=data})}
function render(){
 const shelf=$('shelf');shelf.replaceChildren();
 const W=Math.max(200,shelf.clientWidth-52),rows=[[]];let x=0;
 books.forEach(b=>{const w=sw(b)+3;if(x+w>W&&rows.at(-1).length){rows.push([]);x=0}rows.at(-1).push(b);x+=w});
 rows.forEach(r=>{
  const u=document.createElement('div');u.className='unit';const row=document.createElement('div');row.className='row';
  if(!books.length){const e=document.createElement('div');e.className='empty';e.textContent='Your shelf is empty. Add the first book you\u2019ve read!';row.append(e)}
  r.forEach(b=>{
   const s=document.createElement('button');s.className='spine';
   s.style.cssText=`width:${sw(b)}px;height:${sh(b)}px;background-color:${b.color};color:${lum(b.color)>150?'#222':'#fff'}`;
   s.setAttribute('aria-label',`${b.title}, ${b.rating}/10`);
   if(b.spine){s.classList.add('img');s.style.backgroundImage=`url(${b.spine})`}
   else{const t=document.createElement('span');t.className='t';t.textContent=b.title;t.style.fontSize=(b.title.length>26?11:13)+'px';
    const a=document.createElement('span');a.className='a';a.textContent=b.author||'';
    const rt=document.createElement('span');rt.className='r';rt.textContent=b.rating;s.append(t,a,rt)}
   s.onclick=()=>openModal(b);row.append(s)});
  const bd=document.createElement('div');bd.className='board';u.append(row,bd);shelf.append(u)});
 const n=books.length;$('count').textContent=n?`${n} book${n>1?'s':''} read`:''
}
function pv(){
 const c=$('color').value;$('book').style.setProperty('--c',c);
 $('fT').textContent=$('title').value||'Untitled';$('fA').textContent=$('author').value;$('fR').textContent='\u2605 '+$('rating').value+'/10';
 const f=$('front');f.classList.toggle('img',!!draft.cover);f.style.backgroundImage=draft.cover?`url(${draft.cover})`:'';

  const docs=(await r.json()).docs||[];const res=$('res');res.replaceChildren();
  $('st').textContent=docs.length?'Pick the right edition:':'No results \u2013 you can fill everything in manually.';
  docs.forEach(d=>{const b=document.createElement('button');b.type='button';
   const im=document.createElement('img');if(d.cover_i)im.src=`https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg`;
   const tx=document.createElement('span');tx.textContent=d.title+' ';const sm=document.createElement('small');sm.textContent=[(d.author_name||[])[0],d.first_publish_year].filter(Boolean).join(' \u00b7 ');

 try{const w=await(await fetch('https://openlibrary.org'+d.key+'.json')).json();desc=typeof w.description==='string'?w.description:(w.description&&w.description.value)||''}catch(e){}
 if(d.cover_i){try{cover=await fromUrl(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg?default=false`)}catch(e){}}
 if(!desc||!cover){try{const g=await(await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=1&q='+encodeURIComponent('intitle:'+d.title+(d.author_name?' inauthor:'+d.author_name[0]:'')))).json();gb=(g.items||[])[0]?.volumeInfo;
  if(gb){if(!desc)desc=gb.description||'';if(!cover&&gb.imageLinks){try{cover=await fromUrl(gb.imageLinks.thumbnail.replace('http:','https:').replace('zoom=1','zoom=0'))}catch(e){}}}}catch(e){}}
 desc=desc.replace(/<[^>]+>/g,'').replace(/\r?\n?\s*-{3,}[\s\S]*$/,'').trim();
 if(desc)$('blurb').value=desc.slice(0,1200);
 if(cover){draft.cover=cover;if(!draft.spine){const c=await avgColor(cover);if(c){$('color').value=c;draft.colorSet=true}}}
 $('st').textContent=(cover?'Cover found. ':'No cover found \u2013 upload one below. ')+(desc?'Blurb added.':'No blurb found.');pv()
}

function applyLook(){
 const r=document.documentElement;ALLV.forEach(v=>r.style.removeProperty(v));
 OPTS.forEach(o=>{if(!o.k)return;const it=o.i.find(x=>x[0]===sid(o.k));Object.entries(it[2]).forEach(([p,v])=>r.style.setProperty(p,v))});
 $('plant').innerHTML=PLANTS[sid('plant')]||'';
 const an=ANIMALS[sid('pet')];if(an){cat.style.cssText=an[0];cat.innerHTML=an[1]}
}
const SP={sill:'.window',top:'.case',floor:'.floor',rug:'.rug'};
const avail=k=>!(k==='sill'&&sid('window')==='none')&&!(k==='rug'&&sid('rug')==='none');
function moveCat(){
 const c=Object.keys(SP).filter(k=>avail(k)&&k!==lastSpot);if(!c.length)return;
 const k=c[Math.floor(Math.random()*c.length)];
 document.querySelector(SP[k]).append(catw);catw.dataset.spot=k;lastSpot=k;
 try{localStorage.setItem(CK,k)}catch(e){}
 cat.classList.remove('arrive');void cat.getBoundingClientRect();cat.classList.add('arrive')
}
function buildPanel(){
 const g=$('pgrid');g.replaceChildren();
 OPTS.forEach(o=>{
  if(o.h){const h=document.createElement('h3');h.textContent=o.h;g.append(h);return}
  const l=document.createElement('label');l.textContent=o.l;const sel=document.createElement('select');
  o.i.forEach(([v,n])=>{const op=document.createElement('option');op.value=v;op.textContent=n;sel.append(op)});
  sel.value=sid(o.k);
  sel.onchange=()=>{look[o.k]=sel.value;try{localStorage.setItem(LK,JSON.stringify(look))}catch(e){}applyLook();if(!avail(catw.dataset.spot))moveCat()};
  l.append(sel);g.append(l)})
}
$('set').onclick=()=>{buildPanel();$('lov').classList.add('on');keepSafe().then(ok=>{$('safe').textContent=ok?'\u2713 Your browser has agreed to keep your saved books safe from automatic cleanup. Still export backups now and then.':'Your browser hasn\u2019t confirmed it will protect your saved books from automatic cleanup. Installing the app to your home screen helps, and export backups now and then.'})};
$('lclose').onclick=()=>$('lov').classList.remove('on');
$('lov').onclick=e=>{if(e.target===$('lov'))$('lov').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lov').classList.remove('on')});
$('mvcat').onclick=moveCat;
$('rst').onclick=()=>{look={};try{localStorage.removeItem(LK)}catch(e){}applyLook();buildPanel()};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')moveCat()});
applyLook();moveCat();
async function keepSafe(){try{if(navigator.storage&&navigator.storage.persist){return (await navigator.storage.persisted())||(await navigator.storage.persist())}}catch(e){}return false}
keepSafe();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body></html>
